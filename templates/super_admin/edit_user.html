{% extends "base.html" %}
{% block title %}Editar Usuario - Super Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Editar Usuario</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
            
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Teléfono</label>
                            <input type="text" name="phone" class="form-control" value="{{ user.phone }}">
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input type="checkbox" name="is_active" class="form-check-input" id="is_active" 
                                           {{ 'checked' if user.is_active else '' }}>
                                    <label class="form-check-label" for="is_active">
                                        Usuario Activo
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input type="checkbox" name="is_admin" class="form-check-input" id="is_admin" 
                                           {{ 'checked' if user.is_admin else '' }}>
                                    <label class="form-check-label" for="is_admin">
                                        Admin
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input type="checkbox" name="is_delivery" class="form-check-input" id="is_delivery" 
                                           {{ 'checked' if user.is_delivery else '' }}>
                                    <label class="form-check-label" for="is_delivery">
                                        Delivery
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Negocio Asociado</label>
                            <select name="business_id" class="form-control">
                                <option value="">Ninguno</option>
                                {% for business in businesses %}
                                <option value="{{ business.id }}" {{ 'selected' if user.business_id == business.id }}>{{ business.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                Guardar Cambios
                            </button>
                            <a href="{{ url_for('super_admin.manage_users') }}" class="btn btn-secondary">
                                ← Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
