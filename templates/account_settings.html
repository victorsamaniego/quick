{% extends "base.html" %}
{% block title %}Configuración de Cuenta - QuickGo{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="text-center mb-4">
                <h1 class="display-5 fw-bold">
                    <i class="bi bi-gear-fill text-warning"></i> Configuración de Cuenta
                </h1>
                <p class="text-muted">Personalizá tu experiencia en QuickGo</p>
            </div>
            
            <!-- Tema de Color -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3">
                        <i class="bi bi-palette-fill text-warning"></i> Tema de Color
                    </h5>
                    <p class="text-muted small mb-3">
                        Elegí el color que más te guste para tu experiencia
                    </p>
                    
                    <form method="POST" action="{{ url_for('main.account_settings') }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Seleccioná tu color favorito:</label>
                            <select name="theme" class="form-select form-select-lg" id="themeSelect">
                                <option value="gold" {% if current_theme == 'gold' %}selected{% endif %}>✨ Dorado (Clásico)</option>
                                <option value="blue" {% if current_theme == 'blue' %}selected{% endif %}>🔵 Azul</option>
                                <option value="green" {% if current_theme == 'green' %}selected{% endif %}>🟢 Verde</option>
                                <option value="red" {% if current_theme == 'red' %}selected{% endif %}>🔴 Rojo</option>
                                <option value="purple" {% if current_theme == 'purple' %}selected{% endif %}>🟣 Morado</option>
                                <option value="orange" {% if current_theme == 'orange' %}selected{% endif %}>🟠 Naranja</option>
                                <option value="pink" {% if current_theme == 'pink' %}selected{% endif %}>🩷 Rosa</option>
                                <option value="oscuro" {% if current_theme == 'oscuro' %}selected{% endif %}>🌙 Oscuro - Night Mode</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-warning btn-lg w-100 fw-semibold">
                            <i class="bi bi-save-fill"></i> Guardar Tema
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Vista Previa -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3">
                        <i class="bi bi-eye-fill text-warning"></i> Vista Previa
                    </h5>
                    <div class="row g-3">
                        <div class="col-6 col-md-4">
                            <button class="btn btn-warning w-100">Dorado</button>
                        </div>
                        <div class="col-6 col-md-4">
                            <button class="btn btn-primary w-100">Azul</button>
                        </div>
                        <div class="col-6 col-md-4">
                            <button class="btn btn-success w-100">Verde</button>
                        </div>
                        <div class="col-6 col-md-4">
                            <button class="btn btn-danger w-100">Rojo</button>
                        </div>
                        <div class="col-6 col-md-4">
                            <button class="btn w-100" style="background-color: #6f42c1; color: white;">Morado</button>
                        </div>
                        <div class="col-6 col-md-4">
                            <button class="btn w-100" style="background-color: #fd7e14; color: white;">Naranja</button>
                        </div>
                        <div class="col-6 col-md-4">
                            <button class="btn w-100" style="background-color: #e83e8c; color: white;">Rosa</button>
                        </div>
                        <div class="col-6 col-md-4">
                            <button class="btn w-100" style="background-color: #000000; color: white; border: 2px solid #333;">Oscuro</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Actualizar vista previa al cambiar el select
document.getElementById('themeSelect').addEventListener('change', function() {
    const selectedTheme = this.value;
    document.documentElement.setAttribute('data-theme', selectedTheme);
    document.body.className = 'theme-' + selectedTheme;
});
</script>
{% endblock %}
