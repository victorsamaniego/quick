{% extends "base.html" %}
{% block title %}{{ notification.title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <a href="{{ url_for('main.my_notifications') }}" class="btn btn-outline-secondary mb-3">
                ← Volver a notificaciones
            </a>
            
            <div class="card border-0 shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">{{ notification.title }}</h4>
                </div>
                <div class="card-body p-4">
                    <div class="mb-3">
                        <strong>Fecha:</strong> {{ notification.created_at.strftime('%d/%m/%Y %H:%M') }}
                    </div>
                    <hr>
                    <div class="message-content" style="white-space: pre-wrap; font-size: 1.1rem;">
                        {{ notification.message }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
