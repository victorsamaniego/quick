{% extends "base.html" %}
{% block title %}Recuperar Cuenta - QuickGo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-warning" style="font-size: 4rem;"></i>
                        <h3 class="fw-bold mt-3">Recuperar mi Entrada</h3>
                        <p class="text-muted">Ingresá tu usuario o email para continuar</p>
                    </div>
                    
                    <form method="POST">
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Usuario o Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="identifier" class="form-control" 
                                       placeholder="juan_perez123 o tu@email.com" required autofocus>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-warning w-100 fw-semibold py-2">
                            <i class="bi bi-arrow-right"></i> Continuar
                        </button>
                    </form>
                    
                    <hr class="my-4">
                    <div class="text-center">
                        <a href="{{ url_for('main.login') }}" class="text-muted">
                            <i class="bi bi-arrow-left"></i> Volver al login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
